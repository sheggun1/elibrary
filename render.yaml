services:
  - type: web
    name: lesson-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_KEY
        generateValue: true   # Render creates a random key; read it in dashboard > Environment
      - key: DATABASE_URL
        sync: false           # paste your Neon connection string
      - key: SCHOOL_NAME
        sync: false           # optional
